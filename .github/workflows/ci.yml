name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Unit, types, build, privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=moderate

      - name: Unit tests, typecheck, build and privacy scan
        run: npm run check

      - name: Keep the built bundle for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  browser:
    name: Browser tests (desktop and phone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run the browser tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Keep the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
